
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>Page Not Found | NEET AARAMBH</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .error-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }
    .error-content { max-width: 500px; }
    .error-code {
      margin: 0;
      font: 700 clamp(80px, 18vw, 140px)/1 'Space Grotesk', sans-serif;
      letter-spacing: -8px;
      color: #6be4e7;
    }
    .error-content h1 { font-family: 'Space Grotesk', sans-serif; }
    .error-content p { color: var(--muted); margin-bottom: 26px; }
  </style>
</head>
<body>
  <main class="error-page">
    <div class="error-content">
      <p class="error-code">404</p>
      <h1>Page not found</h1>
      <p>This page may have moved or the URL may be incorrect.</p>
      <a class="btn btn-primary" href="./">Return to Physics Test Series →</a>
    </div>
  </main>
</body>
</html>
